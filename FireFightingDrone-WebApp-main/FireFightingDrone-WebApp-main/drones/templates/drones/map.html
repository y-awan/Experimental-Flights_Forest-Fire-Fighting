{% extends 'base.html' %}
{% load static %}

{% block title %}Fire Zones{% endblock %}

{% block content %}
<style>
    .fire-page {
        max-width: 500px;
        margin: auto;
        background-color: #fff5f5;
        padding: 30px 20px;
        border-radius: 15px;
        font-family: Arial, sans-serif;
    }

    .fire-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }

    .fire-icon {
        width: 60px;
        height: 60px;
        margin-right: 10px;
    }

    #map {
        width: 100%;
        height: 300px;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .zone-details {
        margin-top: 10px;
    }

    .zone-details h4 {
        margin-bottom: 10px;
    }

    .danger {
        color: #e63946;
        font-weight: bold;
    }

    .report-btn {
        margin-top: 15px;
        background-color: #eee;
        padding: 10px 14px;
        border-radius: 6px;
        display: inline-block;
        text-decoration: none;
    }

    .report-icon {
        margin-left: 5px;
    }

    .bottom-nav {
        margin-top: 30px;
        display: flex;
        justify-content: space-around;
        padding-top: 15px;
        border-top: 1px solid #ccc;
        font-size: 14px;
    }

    .bottom-nav div {
        text-align: center;
    }
</style>

<div class="fire-page">
    <div class="fire-header">
        <h2>🔥 Fire Zones</h2>
    </div>

    <div id="map"></div>

    <div class="zone-details">
        <h4>🔥 Fire Zone 1</h4>
        <p><strong>Severity:</strong> <span class="danger">High 🔥</span></p>
        <p><strong>Location:</strong> Forest Edge</p>
        <p><strong>Coordinates:</strong> &lt;-120.50, 85.75&gt;</p>
        <a href="#" class="report-btn">View Detailed Report <span class="report-icon">📄</span></a>
    </div>

    <div class="bottom-nav">
        <div>🏠<br>Home</div>
        <div>🚁<br>Drones</div>
        <div>👤<br>Profile</div>
    </div>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initMap" defer></script>
<script>
    function initMap() {
        const center = {
            lat: parseFloat('{{ default_location.lat }}'),
            lng: parseFloat('{{ default_location.lng }}')
        };

        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 6,
            center: center,
        });

        new google.maps.Marker({
            position: { lat: -120.50, lng: 85.75 },
            map,
            title: "Fire Zone 1",
            icon: {
                url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
            }
        });
    }
</script>
{% endblock %}
