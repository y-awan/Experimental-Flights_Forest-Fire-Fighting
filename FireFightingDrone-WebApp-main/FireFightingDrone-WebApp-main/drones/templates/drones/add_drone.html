{% extends "base.html" %}

{% block title %}Add Drone{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h2 class="text-center mb-4">Add New Drone</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Add Drone</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
